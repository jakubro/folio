name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Fail if the tag and the declared version disagree
        run: |
          declared=$(node -p 'require("./package.json").version')
          if [ "$declared" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME, package.json declares $declared"
            exit 1
          fi

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish
        run: npm publish --access public

      - name: Install mcp-publisher
        run: |
          curl -fsSLo mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz
          echo "1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340  mcp-publisher.tar.gz" \
            | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Stamp the tagged version into server.json
        run: |
          version=${GITHUB_REF_NAME#v}
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json

      # The registry reads mcpName from the version npm serves, and npm serves a just-published
      # version only once it has processed it, minutes later.
      - name: Wait until npm serves the tagged version
        run: |
          for _ in $(seq 60); do
            curl -fsSo /dev/null "https://registry.npmjs.org/@jakubro/folio/${GITHUB_REF_NAME#v}" && exit 0
            sleep 30
          done
          exit 1

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
